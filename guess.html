<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number Guessing Game</title>
<style>
  :root{--bg:#f2f6fa;--card:#fff;--ink:#13213c;--muted:#53627c;--accent:#2d5be3;--line:#d5deea;--good:#1f9d55;--bad:#d6455d}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#16223a;--ink:#e8eefb;--muted:#9fb0cc;--accent:#7ea2ff;--line:#26365a}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:1.05rem/1.5 system-ui,sans-serif;display:grid;place-items:start center;padding:2rem 1rem}
  main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1.5rem;text-align:center}
  h1{margin:0 0 .4rem}
  p{color:var(--muted)}
  form{display:flex;gap:.5rem;margin:1rem 0}
  input{flex:1;font:inherit;padding:.6rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);text-align:center}
  button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:.6rem .9rem;background:var(--accent);color:#fff}
  #msg{font-weight:600;min-height:1.6rem;color:var(--ink)}
  #msg.good{color:var(--good)}
  #msg.bad{color:var(--bad)}
  #again{display:none;margin:.5rem auto 1rem}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Number Guessing Game</h1>
  <p>I picked a number from 1 to 100. Can you guess it?</p>
  <form id="form">
    <input id="guess" type="number" min="1" max="100" placeholder="Your guess" aria-label="Your guess" required>
    <button type="submit">Guess</button>
  </form>
  <div id="msg" role="status"></div>
  <p id="tries">Tries: 0</p>
  <button id="again" type="button">Play again</button>
  <p><a href="index.html">Back to my portfolio</a></p>
</main>
<script>
  let secret, tries, finished;

  const msg = document.getElementById('msg');
  const triesEl = document.getElementById('tries');
  const again = document.getElementById('again');
  const input = document.getElementById('guess');

  function newGame() {
    secret = Math.floor(Math.random() * 100) + 1;  // random whole number, 1 to 100
    tries = 0;
    finished = false;
    msg.textContent = '';
    msg.className = '';
    triesEl.textContent = 'Tries: 0';
    again.style.display = 'none';
    input.value = '';
    input.disabled = false;
    input.focus();
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    if (finished) return;
    const n = Number(input.value);
    if (!Number.isInteger(n) || n < 1 || n > 100) {
      msg.textContent = 'Enter a whole number from 1 to 100.';
      msg.className = 'bad';
      return;
    }
    tries++;
    triesEl.textContent = 'Tries: ' + tries;
    if (n === secret) {
      msg.textContent = 'Correct! You got it in ' + tries + (tries === 1 ? ' try.' : ' tries.');
      msg.className = 'good';
      finished = true;
      input.disabled = true;
      again.style.display = 'block';
    } else {
      msg.textContent = n < secret ? 'Too low. Try a higher number.' : 'Too high. Try a lower number.';
      msg.className = 'bad';
    }
    input.value = '';
  });

  again.addEventListener('click', newGame);
  newGame();
</script>
</body>
</html>
